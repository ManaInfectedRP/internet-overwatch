[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "internet-overwatch"
version = "1.0.0"
description = "Desktop network-monitoring and diagnostics application — answers 'Why am I lagging?'"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Internet Overwatch" }]
keywords = ["network", "monitoring", "latency", "ping", "diagnostics", "gaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1"]
packaging = ["pyinstaller>=6.0"]

[project.scripts]
internet-overwatch = "app.main:main"

[project.urls]
Homepage = "https://github.com/internet-overwatch/internet-overwatch"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
