name: Build

# Every push and pull request runs the test suite and builds a downloadable
# Windows executable, so a PR can be verified without a local toolchain.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        # The suite never opens a window, but PySide6 is imported transitively;
        # offscreen keeps it happy on a headless runner.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -v

      - name: Smoke-test the engine end to end
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONIOENCODING: utf-8
        run: python -m app.main --headless --duration 15

  build-windows:
    name: Build Windows executable
    runs-on: windows-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Generate application icon
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m app.utils.assets

      - name: Build executable
        run: pyinstaller --noconfirm --clean internet_overwatch.spec

      - name: Verify the executable starts
        env:
          PYTHONIOENCODING: utf-8
        shell: pwsh
        run: |
          $exe = "dist/InternetOverwatch.exe"
          if (-not (Test-Path $exe)) { throw "Executable was not produced" }
          $size = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          Write-Host "Built $exe ($size MB)"
          # The bundle is windowed, so --version writes to a file rather than
          # the console; this proves the frozen app boots and its imports work.
          $proc = Start-Process -FilePath $exe -ArgumentList "--headless","--duration","10" `
            -NoNewWindow -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "Executable exited with $($proc.ExitCode)" }
          Write-Host "Executable ran a 10s monitoring session successfully"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: InternetOverwatch-windows
          path: dist/InternetOverwatch.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: InternetOverwatch-windows

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: InternetOverwatch.exe
          generate_release_notes: true
